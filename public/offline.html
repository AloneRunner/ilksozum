<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#38bdf8" />
    <title>Bağlantı yok | İlk Sözüm</title>
    <style>
      :root { color-scheme: light; font-family: Nunito, Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0f9ff; color: #0f172a; }
      main { width: min(88vw, 520px); padding: 32px; text-align: center; background: #fff; border: 1px solid #bae6fd; border-radius: 22px; box-shadow: 0 12px 32px rgb(14 116 144 / 12%); }
      img { width: 112px; height: 112px; object-fit: contain; border-radius: 24px; }
      h1 { margin: 18px 0 10px; font-size: 24px; }
      p { margin: 0 0 22px; color: #475569; line-height: 1.6; }
      button { border: 0; border-radius: 14px; padding: 14px 24px; background: #0ea5e9; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/icon-192x192.png" alt="İlk Sözüm" />
      <h1>İnternet bağlantısı yok</h1>
      <p>İlk Sözüm'ü açmak için internete bağlanın. Bağlantı gelince aşağıdaki düğmeye dokunun.</p>
      <button type="button" onclick="location.reload()">Yeniden dene</button>
    </main>
  </body>
</html>
